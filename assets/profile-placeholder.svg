<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-grad)"/>

  <!-- Futuristic Geometric Circuit Grid -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>

  <!-- Radar sweep lines -->
  <line x1="200" y1="30" x2="200" y2="370" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1"/>
  <line x1="30" y1="200" x2="370" y2="200" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1"/>

  <!-- Silhouette Icon representation -->
  <!-- Head -->
  <circle cx="200" cy="150" r="52" fill="url(#neon-cyan)" opacity="0.9" filter="url(#glow)"/>
  <!-- Body/Shoulders -->
  <path d="M 110 320 C 110 240, 150 220, 200 220 C 250 220, 290 240, 290 320 Z" fill="url(#neon-purple)" opacity="0.85" filter="url(#glow)"/>

  <!-- Monogram Overlay -->
  <text x="200" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="bold" fill="#090d16" text-anchor="middle" dominant-baseline="middle">RMN</text>

  <!-- High-tech corner target brackets -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <path d="M 350 80 L 350 50 L 320 50" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <path d="M 50 320 L 50 350 L 80 350" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <path d="M 350 320 L 350 350 L 320 350" fill="none" stroke="#06b6d4" stroke-width="2.5"/>

  <!-- UAV Status text -->
  <text x="200" y="365" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">AI &bull; DRONE SARTHI &bull; IOT</text>
</svg>
